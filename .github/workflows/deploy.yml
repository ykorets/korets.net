name: Validate and deploy korets.net
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: korets-net-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify CPA financial and scenario calculations
        run: |
          node cpa/model-checks.cjs
          node cpa/launch-checks.cjs
          node cpa/scenario-checks.cjs
      - run: python3 scripts/build_site.py
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://korets.net
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Deploy existing Pages project
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Production deployment token is not configured.'; exit 1; }
          npx wrangler pages deploy dist --project-name korets-net --branch korets.net --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5ee73f367499e0cda9acfbd5966274e5
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify production release and existing pages
        run: npm run verify:live
